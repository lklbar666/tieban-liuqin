<svg viewBox="0 0 680 470" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif">
<title>铁板神数六亲推算的数据流与考刻回馈闭环</title>
<desc>四柱、刻分与演算时刻经转码得出条文编号，查表输出六亲等断语；断语经命主核对得到的六亲事实再回馈到刻分，形成以果推因的闭环。</desc>
<rect width="680" height="470" fill="#ffffff"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="40" y="24" width="150" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="115" y="46" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">生辰四柱</text>
<text x="115" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">年月日时</text>

<rect x="240" y="24" width="180" height="60" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="330" y="46" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">刻分 · 考刻</text>
<text x="330" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">8刻 × 12时辰 = 96局</text>

<rect x="470" y="24" width="170" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="555" y="46" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">演算时刻</text>
<text x="555" y="66" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">求人数</text>

<path d="M115 84 V104 M330 84 V104 M555 84 V104 M115 104 H555" fill="none" stroke="#888780" stroke-width="1.5"/>
<path d="M320 104 V146" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="140" y="150" width="360" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="320" y="172" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">转码</text>
<text x="320" y="192" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">太玄数 · 先天/后天八卦数 · 五音气数</text>

<path d="M320 210 V252" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="180" y="256" width="280" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="320" y="278" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">条文编号</text>
<text x="320" y="298" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">12000 条条文库的索引</text>

<path d="M320 316 V358" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="120" y="362" width="290" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="265" y="384" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">查表 → 断语</text>
<text x="265" y="404" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">六亲生肖 · 姓氏 · 存殁 · 流年</text>

<path d="M410 394 H466" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="438" y="376" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">命主核对</text>

<rect x="470" y="362" width="170" height="64" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="555" y="384" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#791F1F">六亲事实</text>
<text x="555" y="404" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">生肖 · 人数</text>

<path d="M555 362 V128 H400 V92" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="478" y="118" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">考刻：以果推因</text>

<text x="40" y="452" font-size="12" fill="#5F5E5A">红色虚线为闭环所在：六亲事实既是待预测的输出，又是校准参数的输入。</text>
</svg>
